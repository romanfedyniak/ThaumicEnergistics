# For addons: com.github.romanfedyniak:ThaumicEnergistics:<commit>. Gradle needs Java 25, which JitPack
# only has through sdkman.
before_install:
  - JDK=$(sdk list java | grep -o '25\.[0-9.]*-tem' | head -1); sdk install java $JDK; sdk use java $JDK
install:
  - ./gradlew publishToMavenLocal -x test
